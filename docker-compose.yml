version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: football_db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: football_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
